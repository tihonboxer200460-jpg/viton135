<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITON ID - Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--black); }
        .login-header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .login-header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 2px; color: var(--white); }
        .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-card { width: 100%; max-width: 400px; text-align: center; }
        .login-icon { width: 80px; height: 80px; margin: 0 auto 32px; background: linear-gradient(135deg, var(--accent) 0%, #b8963a 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--black); box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3); }
        .login-card h1 { font-family: var(--font-display); font-size: 28px; color: var(--white); margin-bottom: 8px; }
        .login-card .subtitle { font-size: 15px; color: var(--gray-400); margin-bottom: 40px; }
        .login-form { text-align: left; }
        .login-form .form-group { margin-bottom: 20px; }
        .login-form .form-group label { display: block; font-size: 13px; color: var(--gray-300); margin-bottom: 8px; }
        .login-form .form-group input { width: 100%; padding: 14px 16px; font-size: 15px; color: var(--white); background: var(--gray-900); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; transition: var(--transition-fast); }
        .login-form .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1); }
        .login-form .form-group input::placeholder { color: var(--gray-500); }
        .login-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
        .login-options label { display: flex; align-items: center; gap: 8px; color: var(--gray-400); cursor: pointer; }
        .login-options input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
        .login-options a { color: var(--accent); }
        .login-options a:hover { text-decoration: underline; }
        .btn-login { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: var(--black); background: var(--accent); border: none; border-radius: 10px; cursor: pointer; transition: var(--transition-fast); }
        .btn-login:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
        .login-divider { display: flex; align-items: center; gap: 16px; margin: 32px 0; }
        .login-divider span { font-size: 12px; color: var(--gray-500); text-transform: uppercase; letter-spacing: 1px; }
        .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        .login-register { font-size: 14px; color: var(--gray-400); }
        .login-register a { color: var(--accent); font-weight: 500; }
        .login-register a:hover { text-decoration: underline; }
        .login-footer { padding: 20px 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .login-footer p { font-size: 12px; color: var(--gray-600); }
        .login-footer a { color: var(--gray-500); margin: 0 8px; }
        .login-footer a:hover { color: var(--white); }
        @media (max-width: 768px) { .login-header { padding: 16px 20px; } .login-footer { padding: 16px 20px; } }
    </style>
</head>
<body class="login-page">
    <header class="login-header">
        <a href="index.html" class="logo">VITON13</a>
        <a href="#" class="lang-switch" id="langSwitch">EN</a>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div class="login-icon">V</div>
            <h1>VITON ID</h1>
            <p class="subtitle">Единый аккаунт экосистемы VITON13</p>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>Email или телефон</label>
                    <input type="text" name="login" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="login-options">
                    <label>
                        <input type="checkbox" name="remember"> Запомнить меня
                    </label>
                    <a href="#">Забыли пароль?</a>
                </div>
                <button type="submit" class="btn-login">Войти</button>
            </form>
            
            <div class="login-divider">
                <span>или</span>
            </div>
            
            <p class="login-register">
                Нет аккаунта? <a href="#">Создать VITON ID</a>
            </p>
        </div>
    </main>

    <footer class="login-footer">
        <p>
            <a href="privacy.html">Конфиденциальность</a>
            <a href="legal.html">Юридическая информация</a>
            <a href="support.html">Поддержка</a>
        </p>
        <p>© 2026 VITON13 Inc.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
